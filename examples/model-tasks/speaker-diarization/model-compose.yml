controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Speaker Diarization
  description: Detect who spoke when in an audio file using a local pyannote diarization pipeline.
  job:
    input: ${input}
    output: ${output as json}

component:
  type: model
  task: speaker-diarization
  driver: custom
  family: pyannote
  model:
    provider: huggingface
    repository: pyannote/speaker-diarization-3.1
    token: ${env.HF_TOKEN}
  device: cpu
  max_concurrent_count: 1
  action:
    audio: ${input.audio as audio}
    speaker_count: ${input.speaker_count}
    min_speaker_count: ${input.min_speaker_count}
    max_speaker_count: ${input.max_speaker_count}
    params:
      min_segment_duration: ${input.min_segment_duration | 0s}
      merge_gap: ${input.merge_gap | 0s}
