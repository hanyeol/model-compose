controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

# Attach to a Chrome instance the user launched locally with
# `--remote-debugging-port=9222`. YouTube's popout chat refuses to
# render its chat app in Playwright's bundled Chromium ("your browser
# is out of date" fallback), so we drive a real Chrome over CDP.
# macOS example:
#
#   /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome \
#     --remote-debugging-port=9222 \
#     --user-data-dir=/tmp/chrome-yt-live-chat
#
# The tab stays open across polling ticks, so window.__seenIds keeps
# growing and only fresh messages come back on each pull.

workflows:
  # Producer: opens the popout chat page once, installs a small in-page
  # reader that remembers which messages it has already emitted, then
  # tail-recurses to pull new messages on an interval and push each
  # one into the shared queue.
  - id: collect-chat
    default: true
    title: Collect YouTube live chat
    description: |
      Open the popout live chat for a video and continuously extract
      new messages into the `chat-messages` queue. Leave `save-chat`
      running in parallel to persist them. Cancel this workflow to
      stop collecting.
    jobs:
      # One-time setup: navigate to the popout chat, then install the
      # reader on window. The reader tracks seen message ids so each
      # subsequent call only returns fresh ones.
      - id: open-chat
        component: browser
        action: open-chat
        input:
          video_id: ${input.video_id}

      - id: setup-reader
        component: browser
        action: setup-reader
        input:
          video_id: ${input.video_id}
        depends_on: [ open-chat ]

      # Install the Super Chat / Super Sticker ticker reader on the
      # same page. Kept separate from setup-reader so the two readers
      # can evolve independently (different DOM, different fields).
      - id: setup-paid-reader
        component: browser
        action: setup-paid-reader
        input:
          video_id: ${input.video_id}
        depends_on: [ open-chat ]

      # - id: pull-chat
      #   component: browser
      #   action: pull-new-messages
      #   output: ${output as json}
      #   depends_on: [ setup-reader ]

      # Steady state: invoke the reader, fan out to the queue, wait,
      # then re-enter this workflow to poll again.
      # - id: poll
      #   component: poller
      #   input:
      #     video_id: ${input.video_id}
      #     poll_interval: ${input.poll_interval | 2s}
      #   depends_on: [ setup-reader ]

  # Steady-state polling loop factored out so the setup jobs above run
  # exactly once. Each invocation pulls new messages, enqueues them,
  # sleeps, then tail-recurses.
  - id: poll-chat
    jobs:
      - id: pull-chat
        component: browser
        action: pull-new-messages
        output: ${output as json}

  # Same shape as poll-chat, but pulls Super Chat / Super Sticker
  # items from the ticker strip along the top of the chat rather than
  # the main message stream. Assumes the ticker reader is already
  # installed on window by setup-paid-reader (invoked once by
  # collect-chat) and piggybacks on the same tab.
  - id: poll-paid-messages
    jobs:
      - id: pull-paid
        component: browser
        action: pull-new-paid-messages
        output: ${output as json}

      # - id: enqueue
      #   type: for-each
      #   input: ${jobs.pull-chat.output}
      #   do:
      #     component: chat-messages
      #     action: enqueue
      #     input: ${item}
      #   depends_on: [ pull-chat ]

  #     - id: wait
  #       type: delay
  #       mode: time-interval
  #       duration: ${input.poll_interval | 2s}
  #       depends_on: [ enqueue ]

  #     - id: loop
  #       component: poller
  #       input:
  #         video_id: ${input.video_id}
  #         poll_interval: ${input.poll_interval}
  #       depends_on: [ wait ]

  # Consumer: drains the queue and writes one JSON file per message.
  # Start once and leave running alongside the collector.
  # - id: save-chat
  #   title: Save chat messages to disk
  #   description: |
  #     Continuously dequeue chat messages and save each as a JSON file
  #     under ./output/<video_id>/<message_id>.json. Runs until cancelled.
  #   jobs:
  #     - id: subscribe
  #       component: chat-messages
  #       action: dequeue

  #     - id: save
  #       type: for-each
  #       input: ${jobs.subscribe.output}
  #       do:
  #         component: storage
  #         input:
  #           path: ${item.video_id}/${item.id}.json
  #           source: ${item as json}
  #       depends_on: [ subscribe ]

components:
  # Attach to the user-launched Chrome over CDP. The component instance
  # is cached by id and the session_id below pins one tab, so the page
  # and window.__seenIds survive across polling ticks — no reload, no
  # re-parsing the whole DOM every iteration.
  - id: browser
    type: web-browser
    driver: chrome
    debugger:
      host: localhost
      port: 9222
    timeout: 45s
    actions:
      # Popout chat is lighter than /watch (no video player), so
      # domcontentloaded is a reasonable wait target — chat itself
      # keeps a long-poll open so networkidle would never resolve.
      - id: open-chat
        method: navigate
        session_id: youtube-live-chat
        url: https://www.youtube.com/live_chat?v=${input.video_id}&is_popout=1
        wait_until: domcontentloaded

      # Setup a reader on window that scans chat message nodes,
      # remembers ids it has already reported, and returns only new
      # ones. Runs once; the polling action just calls it.
      - id: setup-reader
        method: evaluate
        session_id: youtube-live-chat
        expression: |
          (() => {
            window.__videoId = "${input.video_id}";
            window.__seenIds = new Set();
            window.__chatReader = () => {
              const nodes = document.querySelectorAll(
                "yt-live-chat-text-message-renderer"
              );
              const fresh = [];
              for (const n of nodes) {
                const id = n.id;
                if (!id || window.__seenIds.has(id)) continue;
                window.__seenIds.add(id);
                fresh.push({
                  id,
                  video_id: window.__videoId,
                  author: n.querySelector("#author-name")?.innerText?.trim() ?? "",
                  message: n.querySelector("#message")?.innerText?.trim() ?? "",
                  timestamp: n.querySelector("#timestamp")?.innerText?.trim() ?? "",
                });
              }
              return fresh;
            };
            return true;
          })()

      - id: pull-new-messages
        method: evaluate
        session_id: youtube-live-chat
        expression: window.__chatReader()

      # Setup a reader on window that scans the paid-message ticker
      # (Super Chats and Super Stickers scrolling along the top of the
      # chat), remembers ids it has already reported, and returns only
      # new ones. The ticker DOM carries the author, the paid amount,
      # and the tint colour as inline styles.
      - id: setup-paid-reader
        method: evaluate
        session_id: youtube-live-chat
        expression: |
          (() => {
            window.__videoId = "${input.video_id}";
            window.__seenPaidIds = new Set();
            window.__paidReader = () => {
              const nodes = document.querySelectorAll(
                "yt-live-chat-ticker-paid-message-item-renderer"
              );
              const fresh = [];
              for (const n of nodes) {
                const id = n.id;
                if (!id || window.__seenPaidIds.has(id)) continue;
                window.__seenPaidIds.add(id);
                fresh.push({
                  id,
                  video_id: window.__videoId,
                  author: n.querySelector("#author-name")?.innerText?.trim()
                       ?? n.getAttribute("aria-label") ?? "",
                  amount: n.querySelector("#amount")?.innerText?.trim() ?? "",
                });
              }
              return fresh;
            };
            return true;
          })()

      - id: pull-new-paid-messages
        method: evaluate
        session_id: youtube-live-chat
        expression: window.__paidReader()

  # Shared FIFO queue between the collector and the saver. Cached
  # across invocations so both workflows share the same buffer.
  - id: chat-messages
    type: data-queue
    driver: memory
    max_size: 1000
    actions:
      - id: enqueue
        method: enqueue
        item: ${input}
      - id: dequeue
        method: dequeue

  - id: storage
    type: file-store
    driver: local
    base_path: ./output
    action:
      method: put
      path: ${input.path}
      source: ${input.source}
    output: ${result.path}

  # Self-reference so the polling workflow can tail-recurse.
  # - id: poller
  #   type: workflow
  #   action:
  #     workflow: poll-chat
  #     input: ${input}
