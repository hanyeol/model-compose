[project]
name = "model-compose"
version = "0.4.121"
description = "model-compose: Declarative AI Workflow Orchestrator"
authors = [
    { name = "Hanyeol Cho", email = "hanyeol.cho@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click",
    "pyyaml",
    "pydantic",
    "python-dotenv",
    "packaging",
    "aiofiles",
    "ulid",
    "Pillow>=9.1.0",
    "async_timeout>=4.0; python_version < '3.11'"
]

[project.scripts]
model-compose = "mindor.cli.compose:compose_command"

[project.urls]
"Homepage" = "https://github.com/hanyeol/model-compose"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mindor.core.runtime.bootstrap" = ["requirements.txt", "scripts/*/*.py", "scripts/*/requirements.txt"]
"mindor.core.component.runtime.container.assets" = ["Dockerfile.*", "*.stub.txt", "*.stub.sh"]
"mindor.core.controller.runtime.container.assets" = ["Dockerfile.*", "*.stub.txt", "*.stub.sh", "bootstrap.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
