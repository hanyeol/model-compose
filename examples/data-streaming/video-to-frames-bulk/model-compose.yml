controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflows:
  # List videos in a directory, then for each one extract frames and save
  # them to disk. The per-video work is inlined as a pipeline inside the
  # for-each `do`, so there's no separate sub-workflow to dispatch.
  - id: process-directory
    title: Directory → Videos → Frames → Local Files
    description: |
      List every video in ./input/videos and, for each one, stream its
      frames through the extractor and save them under ./output/frames.
    jobs:
      # List the videos in the source directory. `list` returns a dict
      # with an `items` array whose entries expose `path`, `url`, `size`,
      # `content_type`, and `modified_at`.
      - id: list-videos
        component: source-store
        # Forward just the items array so the next job can iterate over
        # per-video dicts directly.
        output: ${output.items}

      # Iterate over the video items. For each one, run a two-step
      # pipeline: extract frames as a stream, then save each frame under
      # a per-video subdirectory. `${item}` inside `do` is the current
      # list entry from `list-videos`.
      - id: process-videos
        type: for-each
        input: ${jobs.list-videos.output}
        do:
          type: pipeline
          steps:
            # `;url` tells the renderer to fetch the string as a URL
            # (here a `file://` URL from the file-store list) and hand
            # the extractor a raw video stream.
            - component: frame-extractor
              input:
                video: ${item.url as video;url}
                frame_interval: 30

            # Save each decoded frame. The inner `${item}` here is a
            # single frame from the extractor's stream; `${item.path}`
            # from the outer for-each is captured via the pipeline's
            # input chain, so we reference the video's path through the
            # outer scope using the for-each item's `path` field.
            - type: for-each
              input: ${output}
              do:
                component: storage
                input:
                  # Group frames by the source video's relative path so
                  # runs across multiple videos don't collide in the
                  # output tree.
                  path: ${item.filename}
                  source: ${item.image as image/png}

components:
  # Reads the input directory and lists matching video files.
  - id: source-store
    type: file-store
    driver: local
    base_path: ./input/videos
    action:
      method: list
      pattern: "*.mov"

  # Extracts frames from a video using ffmpeg.
  # `streaming: true` makes the action yield frames as they are decoded
  # so the following for-each can save them incrementally.
  - id: frame-extractor
    type: video-frame-extractor
    driver: ffmpeg
    action:
      video: ${input.video}
      frame_interval: ${input.frame_interval}
      filename_format: frame-%04d.png
      streaming: true

  # Writes a single file to the local output directory.
  - id: storage
    type: file-store
    driver: local
    base_path: ./output/frames
    action:
      method: put
      path: ${input.path}
      source: ${input.source}
    output: ${result.path}
