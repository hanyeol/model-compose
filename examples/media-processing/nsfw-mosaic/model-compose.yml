controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflows:
  # ---------------- Main workflow: mosaic NSFW regions in a video ----------------
  - id: nsfw-mosaic
    default: true
    title: NSFW Mosaic
    description: |
      Redact NSFW regions in a video by pixelating (or blurring) each
      detected bounding box, then reassemble the redacted frames back
      into an mp4 with the original audio track preserved.

      Detection is done with an Ultralytics YOLO model trained on NSFW
      classes. Point `nsfw-tracker.model.path` at your own weights
      (see `README.md` for one common source).

      The pipeline runs end-to-end in streaming mode so memory stays
      bounded regardless of clip length: frames flow one-by-one from the
      extractor through object-tracking, and each per-frame detection
      chunk (carrying the source image plus its NSFW bounding boxes) is
      mosaicked and handed directly to ffmpeg's encoder without
      materialising the full frame set.
    jobs:
      # 1. Fan the raw upload stream out to two independent consumers.
      #    The upload is a single-use stream, so it can only be drained
      #    by one downstream job — fan-out tees it into two branches
      #    that the audio extractor and the frame extractor consume in
      #    parallel, without landing the video on disk.
      - id: fanout-video
        type: fan-out
        input: ${input.video as video}
        output: [ for-audio, for-frames ]

      # 2. Split the audio track out of the video (preserved unchanged).
      - id: extract-audio
        component: audio-extractor
        input:
          source: ${jobs.fanout-video.output.for-audio}
        depends_on: [ fanout-video ]

      # 3. Stream frames out of the video. `streaming: true` emits frames
      #    as ffmpeg decodes them, without buffering the whole video.
      - id: extract-frames
        component: frame-extractor
        input:
          video: ${jobs.fanout-video.output.for-frames}
          frame_interval: 1
        depends_on: [ fanout-video ]

      # 4. Object-tracking runs on the frame stream and re-emits a chunk
      #    stream. We disable tracks/metadata and enable detection chunks
      #    (with the source image) so the downstream stream contains only
      #    `{type: "detection", number, timestamp, objects: [{track_id,
      #    label, bounding_box}], image}` — exactly the shape the mosaic
      #    step needs.
      #
      #    Detection chunk emission is delayed by `merge_gap` seconds so
      #    the tracker can interpolate short gaps: if the detector misses
      #    the box on a frame between two hits, the interpolated box is
      #    added to the missing frame's `objects` list, so redaction
      #    covers those otherwise-uncovered frames too.
      - id: track-regions
        component: nsfw-tracker
        input:
          frames: ${jobs.extract-frames.output}
          frame_rate: ${input.frame_rate as number | 30}
          min_confidence: ${input.min_confidence as number | 0.35}
          bounding_box_padding: ${input.bounding_box_padding as number | 0.1}
          merge_gap: ${input.merge_gap as number | 0.5}
        depends_on: [ extract-frames ]

      # 5. For each per-frame detection chunk, fold every detected region
      #    onto the source image with an inline `accumulate` job — each
      #    iteration takes the running image (`${accumulator}`) and returns
      #    the same image with one more region redacted. If a frame has no
      #    detections the accumulator falls through unchanged. Because the
      #    outer for-each input is a stream the output is also a stream, so
      #    mosaicked frames flow lazily into the encoder below.
      - id: mosaic-frames
        type: for-each
        input: ${jobs.track-regions.output}
        batch_size: 16
        depends_on: [ track-regions ]
        do:
          type: accumulate
          input: ${item.objects}
          accumulator: ${item.image}
          do:
            component: mosaic
            input:
              image: ${accumulator}
              x: ${item.bounding_box.x}
              y: ${item.bounding_box.y}
              width: ${item.bounding_box.width}
              height: ${item.bounding_box.height}
              mode: ${input.mode as select/pixelate,blur | pixelate}
              block_scale: ${input.block_scale as number | 0.1}
              blur_radius: ${input.blur_radius as number | 8.0}
              corner_scale: ${input.corner_scale as number | 0.3}

      # 6. Reassemble the mosaicked frame stream + the original audio into mp4.
      #    The encoder pulls frames from the stream as ffmpeg is ready for
      #    them, so no full-video buffering happens at this stage either.
      - id: encode-video
        component: encoder
        input:
          # The for-each above emits a stream where each chunk is a single
          # PIL image. The encoder expects an image-array input (one array
          # per video), so wrap the stream with `+` — the renderer treats
          # `+` as "flatten these chunks into one continuous image array
          # stream" so ffmpeg pulls frames one by one without materialising
          # the full list.
          frames:
            "+": ${jobs.mosaic-frames.output}
          frame_rate: ${input.frame_rate as number | 30}
          audio: ${jobs.extract-audio.output}
        depends_on: [ extract-audio, mosaic-frames ]

    output:
      video: ${jobs.encode-video.output as video}

components:
  # ---- Split audio track out (mp3 by default) ----
  - id: audio-extractor
    type: audio-extractor
    driver: ffmpeg
    action:
      source: ${input.source}
      format: mp3

  # ---- Stream every frame at native fps ----
  # `output: ${result[].image}` projects the extractor's default
  # `{image, timestamp}` chunk stream down to just the PIL images —
  # object-tracking's `frames` input expects an image stream, not a dict
  # stream.
  - id: frame-extractor
    type: video-frame-extractor
    driver: ffmpeg
    action:
      video: ${input.video}
      frame_interval: ${input.frame_interval}
      streaming: true
      output: ${result[].image}

  # ---- NSFW tracker (Ultralytics YOLO + built-in tracker) ----
  # Point `model.path` at your NSFW-trained YOLO weights. One commonly
  # used set is the NudeNet-derived YOLO model; see README.md for a
  # link. Each detection chunk carries the standard object-tracking
  # payload: `{number, timestamp, image, objects: [{track_id, label,
  # label_id, bounding_box: {x, y, width, height}, score}]}` — the
  # `bounding_box` shape `mosaic` consumes below.
  #
  # Why tracking (and not a bare detector):
  #   - Streaming detection chunks already bundle the source image with
  #     each frame's boxes, so the mosaic step needs one for-each, not
  #     a detect+accumulate pipeline per frame.
  #   - The tracker interpolates short detection gaps (see `merge_gap`
  #     above): a region briefly lost between two hits still gets a
  #     bounding box on the missed frames, so redaction doesn't flicker.
  #   - `min_frame_count` is *not* applied to detection chunks (only to
  #     confirmed tracks in the non-streaming result), so 1-frame
  #     detections still reach the mosaic step — the correct trade-off
  #     for redaction, where false positives are safer than misses.
  #
  # `labels` restricts detection to the named NSFW classes so covered
  # or non-anatomical classes are dropped before they reach the mosaic
  # step. Class names depend on the model — check the weights' labels
  # list; unknown names raise a clear error at load time.
  #
  # Serialise through a single tracker instance so GPU memory stays
  # bounded — the outer for-each still fans out CPU-side work (mosaic)
  # across frames.
  - id: nsfw-tracker
    type: model
    task: object-tracking
    driver: custom
    family: yolo
    max_concurrent_count: 1
    model:
      provider: local
      path: ./models/nsfw_detector.pt
    action:
      frames: ${input.frames as image}
      frame_rate: ${input.frame_rate}
      streaming: true
      return_tracks: false
      return_detections: true
      return_frame_image: true
      return_metadata: false
      labels:
        - FEMALE_GENITALIA_EXPOSED
        - MALE_GENITALIA_EXPOSED
        - ANUS_EXPOSED
      bounding_box_padding: ${input.bounding_box_padding}
      params:
        min_confidence: ${input.min_confidence}
        iou_threshold: 0.5
        agnostic_nms: true
        merge_gap: ${input.merge_gap}
        tracker: bytetrack

  # ---- Mosaic a single bounding box in one call ----
  # Called once per detected region by the inline `accumulate` job.
  # `${input.image}` is the running accumulator — the frame with all
  # previously-processed regions already redacted.
  - id: mosaic
    type: image-processor
    driver: native
    action:
      method: mosaic
      image: ${input.image as image}
      x: ${input.x}
      y: ${input.y}
      width: ${input.width}
      height: ${input.height}
      mode: ${input.mode}
      block_scale: ${input.block_scale}
      blur_radius: ${input.blur_radius}
      corner_scale: ${input.corner_scale}

  # ---- Reassemble mosaicked frames + original audio into an mp4 ----
  - id: encoder
    type: video-encoder
    driver: ffmpeg
    action:
      frames: ${input.frames as image}
      frame_rate: ${input.frame_rate}
      audio: ${input.audio}
      encoding:
        format: mp4
        video:
          codec: libx264
          bitrate: 8M
        audio:
          codec: aac
          bitrate: 192k
