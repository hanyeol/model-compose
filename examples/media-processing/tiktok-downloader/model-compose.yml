controller:
  adapter:
    type: http-server
    base_path: /api
    port: 8080
  webui:
    driver: gradio
    port: 8081

# Attach to a Chrome instance the user launched locally with
# `--remote-debugging-port=9222`. That way login, CAPTCHA, and any 2FA
# happen in a real browser window the user can see and interact with —
# no Docker, no VNC. macOS example:
#
#   /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome \
#     --remote-debugging-port=9222 \
#     --user-data-dir=/tmp/chrome-tiktok-profile
#
# Log into TikTok once in that window before running the workflow.
# Public videos work without a session, but region-locked, age-gated,
# and "login to continue" clips need an authenticated cookie set.

workflows:
  - id: download-tiktok-video
    title: Download a TikTok video
    description: >
      Sign into TikTok in the attached Chrome (only if the session
      isn't already warm), hand the resulting cookies to yt-dlp, and
      download the requested video. Use this when a video is
      region-restricted, age-gated, or hidden behind a login wall;
      public clips also work without any cookies.
    jobs:
      # Land on TikTok so the session cookies are set on the right
      # domain. If the user is already signed in from a prior run the
      # interrupt below is a quick click-through.
      - id: open-tiktok
        component: browser
        action: navigate
        input:
          url: https://www.tiktok.com/

      # Ask the page whether the user is already signed in. TikTok's
      # profile button (`[data-e2e="profile-icon"]`) only renders for
      # authenticated sessions, so its presence is the cheapest
      # boolean signal available without waiting.
      - id: check-signin
        component: browser
        action: check-signin
        depends_on: [ open-tiktok ]

      # Only interrupt when the previous job reported the user is not
      # signed in. If check-signin returned true (reused session from
      # a prior run), skip the pause entirely and proceed straight to
      # collecting cookies. TikTok's login flow (SMS code, CAPTCHA,
      # third-party OAuth) is hostile to automation, so we don't try
      # to script it — we just wait for the profile icon to appear,
      # which only renders once the account is active.
      - id: wait-for-signin
        component: browser
        action: wait-for-profile-icon
        interrupt:
          before:
            condition:
              input: ${jobs.check-signin.output}
              value: false
            message: >
              Sign into TikTok in the Chrome window attached at
              localhost:9222, then click Resume. The workflow will
              wait for your profile icon to appear before continuing.
        depends_on: [ check-signin ]

      # Grab every cookie scoped to tiktok.com. yt-dlp's TikTok
      # extractor keys off `sessionid`, `tt_webid_v2`, and a few other
      # cookies that live on this domain.
      - id: collect-cookies
        component: browser
        action: get-tiktok-cookies
        depends_on: [ wait-for-signin ]

      - id: download
        component: downloader
        action: download
        input:
          url: ${input.url @(description TikTok video URL)}
          format: ${input.format | mp4 @(description mp4 | webm | mkv)}
          cookies: ${jobs.collect-cookies.output}
        output:
          # `as video` picks the video stream wrapper so the WebUI renders
          # an inline player and the HTTP response advertises the right
          # content type.
          video: ${output as video}
        depends_on: [ collect-cookies ]

components:
  - id: browser
    type: web-browser
    driver: chrome
    debugger:
      host: localhost
      port: 9222
    timeout: 60s
    actions:
      - id: navigate
        method: navigate
        url: ${input.url}
        wait_until: domcontentloaded

      # Return true/false for "is the profile icon present". TikTok
      # renders the top-right profile icon with client-side JS after
      # DOMContentLoaded, so a single querySelector at load time
      # reports false even for already-signed-in sessions. Poll for up
      # to 5 seconds so a warm session is detected without triggering
      # the interrupt.
      - id: check-signin
        method: evaluate
        expression: >
          (async () => {
            const selector = "[data-e2e='profile-icon'], [data-e2e='nav-profile']";
            for (let i = 0; i < 10; i++) {
              if (document.querySelector(selector)) return true;
              await new Promise(r => setTimeout(r, 500));
            }
            return false;
          })()

      # Poll for the profile icon in the top-right. Its presence is
      # the cheapest signal that the user is signed in — TikTok's DOM
      # for the login button shuffles more often than the profile
      # icon's `data-e2e` hook.
      - id: wait-for-profile-icon
        method: wait-for
        selector: "[data-e2e='profile-icon'], [data-e2e='nav-profile']"
        condition: visible
        timeout: 300s

      - id: get-tiktok-cookies
        method: get-cookies
        urls:
          - https://www.tiktok.com/

  - id: downloader
    type: media-downloader
    driver: ytdlp
    # To fetch the no-watermark version of a public video, uncomment
    # the extractor_args below. This routes the metadata request
    # through TikTok's mobile API host, which returns a clean video
    # URL instead of the watermarked web stream. The host name
    # occasionally changes — if downloads start failing, check the
    # yt-dlp TikTok extractor source for the current value.
    #
    # Note: scraping the no-watermark stream may conflict with
    # TikTok's Terms of Service in some jurisdictions. Enable it only
    # when you have the rights to the content.
    #
    # extractor_args:
    #   tiktok:
    #     api_hostname: api22-normal-c-useast2a.tiktokv.com
    actions:
      - id: download
        url: ${input.url}
        format: ${input.format}
        # CDP/Playwright-shaped cookie list. yt-dlp writes these into a
        # Netscape cookie file internally, preserving domain, path,
        # secure, and expiry from each cookie object.
        cookies: ${input.cookies}
