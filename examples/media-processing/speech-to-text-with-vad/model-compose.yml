controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Speech to Text with VAD Pre-Segmentation
  description: |
    Detect speech regions with Silero VAD, clip them out of the source
    audio, and transcribe each clip with Whisper — all in a single
    streaming pipeline. VAD emits segments as they are confirmed; the
    audio-clipper consumes that stream to produce `{audio, start_time,
    end_time}` clips (via `return_timestamp: true`); a for-each job
    runs Whisper on each clip and passes the clip's VAD start time as
    STT's `time_offset`, so each returned segment carries an absolute
    timestamp in the original audio. The workflow output uses the
    `+` operator to lazily flatten the per-clip segment streams into
    one continuous segment stream.
  jobs:
    - id: detect
      component: vad
      input:
        audio: ${input.audio as audio}

    - id: clip
      component: clipper
      input:
        audio: ${input.audio as audio}
        spans: ${jobs.detect.output}
      depends_on: [ detect ]

    # For each clip, run Whisper with the clip's VAD start_time set as
    # `time_offset` so segment timestamps are absolute (offset into the
    # original audio) rather than clip-relative. `${item}` binds to one
    # `{audio, start_time, end_time}` clip from the stream.
    - id: transcribe
      type: for-each
      input: ${jobs.clip.output}
      do:
        component: stt
        input:
          audio: ${item.audio}
          time_offset: ${item.start_time}
          language: ${input.language as select/en,ko,ja,zh | en}
      # `for-each` with a stream input already produces a stream output.
      # Each iteration's STT run yields a segment stream, so the raw
      # shape is stream[stream[segment]]. `+` lazily flattens the outer
      # stream so each pull yields one segment dict directly.
      output:
        "+": ${output}
      depends_on: [ clip ]

  output: ${jobs.transcribe.output as stream/json}

components:
  # Silero VAD in streaming mode: emits { start_time, end_time,
  # confidence } dicts as speech regions are confirmed. Silero only
  # supports 8kHz / 16kHz — 16kHz matches Whisper's native rate so
  # the downstream clip -> STT path avoids an extra resample.
  - id: vad
    type: model
    task: voice-activity-detection
    driver: custom
    family: silero
    device: cpu
    max_concurrent_count: 1
    action:
      audio: ${input.audio}
      sample_rate: 16000
      streaming: true
      params:
        threshold: 0.5
        min_speech_duration: 250ms
        max_speech_duration: 30s   # cap so a single burst doesn't outgrow Whisper's 30s window
        min_silence_duration: 500ms
        speech_padding_time: 100ms

  # ffmpeg-driven clipper. Given one audio source and a stream of span
  # dicts, produces one clip per span. `return_timestamp: true` wraps
  # each clip as `{audio, start_time, end_time}` so the downstream
  # for-each can pipe both the audio and its source span to STT.
  - id: clipper
    type: audio-clipper
    driver: ffmpeg
    action:
      audio: ${input.audio}
      span: ${input.spans}
      return_timestamp: true

  # Whisper turbo, streaming + per-segment timestamps. Consumed one
  # clip at a time by the transcribe job's for-each; `time_offset`
  # comes from the clip's VAD start_time so the emitted segments carry
  # absolute positions in the original audio.
  - id: stt
    type: model
    task: speech-to-text
    driver: huggingface
    architecture: whisper
    model: openai/whisper-large-v3-turbo
    device: mps
    max_concurrent_count: 1
    action:
      audio: ${input.audio}
      language: ${input.language}
      time_offset: ${input.time_offset}
      task: transcribe
      return_timestamps: true
      streaming: true
      max_output_length: 444
      # VAD already trims silence, so clips are almost always real speech.
      # Loosen Whisper's per-segment filters so short/quiet/noisy segments
      # don't get silently dropped.
      params:
        no_speech_threshold: 0.2         # default 0.6 — skip only when very confidently silent
        log_prob_threshold: -2.5         # default -1.0 — keep lower-confidence segments
        compression_ratio_threshold: 3.0 # default 2.4 — allow more repetition before flagging as hallucination
