controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Fine-tune Cloudflare/clef on a typed-decision dataset
  description: Train the Clef joint_schema_model on a {state, schema, answers} dataset, saving a drop-in replacement for the Cloudflare/clef snapshot path.
  jobs:
    - id: train
      component: trainer
      input:
        dataset:       ${input.dataset | ./train.jsonl}
        output_dir:    ${input.output_dir | ./output/clef}
        num_epochs:    ${input.num_epochs as integer | 3}
        batch_size:    ${input.batch_size as integer | 4}
        learning_rate: ${input.learning_rate as number | 2e-5}
      output:
        output_dir: ${output.output_dir}
        train_loss: ${output.train_loss}
        metrics:    ${output.metrics}

components:
  - id: trainer
    type: model-trainer
    task: typed-decision
    driver: clef
    # The trained-model path can be swapped at infer time by passing a local
    # directory; by default we fine-tune from the official Clef snapshot.
    model: Cloudflare/clef
    device: auto
    action:
      dataset: ${input.dataset}
      output_dir: ${input.output_dir | ./output/clef}
      num_epochs: ${input.num_epochs as integer | 3}
      per_device_train_batch_size: ${input.batch_size as integer | 4}
      learning_rate: ${input.learning_rate as number | 2e-5}
      bf16: true
      eval_steps: 500
