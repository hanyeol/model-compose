controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflows:
  # Producer: enqueues one video source (local path or URL) per
  # invocation. Call this workflow repeatedly to line up multiple
  # videos; the broadcaster workflow drains them in order and streams
  # each one to YouTube Live.
  - id: publish-video
    title: Enqueue a video for broadcast
    description: |
      Re-encode a single video source into an MPEG-TS byte stream and
      push it onto the `media-queue` paired with its (optional)
      override audio track. Run this workflow (via HTTP or the webui)
      each time you want to add a video to the broadcast queue. Leave
      `broadcast-live` running to stream each queued item to YouTube
      Live back-to-back.

      Because the encoder emits a streamable MPEG-TS instead of a
      spooled file, the rtmp-publisher receives it via `pipe:0`
      without an intermediate temp file.
    jobs:
      - id: encode
        component: encoder
        input:
          video: ${input.video as video}

      - id: publish
        component: media-queue
        action: enqueue
        input:
          video: ${jobs.encode.output}
          audio: ${input.audio as audio}
        depends_on: [ encode ]

  # Consumer: long-running workflow that reads media references from
  # the queue and pushes them to YouTube Live via RTMP. Each queue
  # item bundles a video and audio stream together; the `"|"` split
  # operator fans the dequeue stream into two parallel per-field
  # streams that the rtmp-publisher accepts directly.
  #
  # Runs until cancelled — cancel the workflow to stop the broadcast.
  - id: broadcast-live
    title: Broadcast queued videos to YouTube Live
    description: |
      Continuously dequeue paired video+audio items and stream each
      one to YouTube Live over RTMP. Start this once and leave it
      running; use the runs API or the webui to cancel it when done.
      Requires YOUTUBE_STREAM_KEY in the environment (see .env.sample).
    jobs:
      - id: subscribe
        component: media-queue
        action: dequeue

      - id: broadcast
        component: publisher
        input:
          "|": ${jobs.subscribe.output}
          video: ${item.video}
          audio: ${item.audio}
        depends_on: [ subscribe ]

components:
  # Video encoder that re-encodes each input to MPEG-TS in streaming
  # mode, so the enqueued item is a byte stream (not a spooled file).
  # MPEG-TS is one of the streamable input formats the rtmp-publisher
  # accepts, so it is fed to ffmpeg via `pipe:0` on the consumer side.
  - id: encoder
    type: video-encoder
    driver: ffmpeg
    action:
      video: ${input.video}
      streaming: true
      encoding:
        format: mpegts
        video:
          codec: libx264
          bitrate: 4500k
          resolution: 1920x1080
          fps: 30
        audio:
          codec: aac
          bitrate: 160k

  # Single in-process queue shared between the producer and consumer
  # workflows. Each queue item is a `{video, audio}` dict, so the pair
  # travels together and stays aligned without any positional
  # coordination between separate queues.
  - id: media-queue
    type: data-queue
    driver: memory
    max_size: 100
    actions:
      - id: enqueue
        method: enqueue
        item: ${input}
      - id: dequeue
        method: dequeue

  # RTMP publisher targeting YouTube Live. Reads the stream key from
  # the environment so the model-compose.yml stays committable. The
  # publish action blocks until the current video finishes streaming,
  # which is what lets the queue-fed stream broadcast videos
  # back-to-back without gaps between publishes.
  - id: publisher
    type: rtmp-publisher
    driver: ffmpeg
    action:
      url: rtmp://a.rtmp.youtube.com/live2/${env.YOUTUBE_STREAM_KEY}
      video: ${input.video}
      audio: ${input.audio}
      encoding:
        video:
          codec: libx264
          bitrate: 4500k
          resolution: 1920x1080
          fps: 30
        audio:
          codec: aac
          bitrate: 160k
