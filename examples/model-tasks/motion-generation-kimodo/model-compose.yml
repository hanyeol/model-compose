controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflows:
  - id: generate
    default: true
    title: Generate Motion (Kimodo)
    description: Generate a 3D human motion sequence from a text prompt. Returns an NPZ with joint positions, rotation matrices, and foot-contact labels.
    job:
      component: kimodo
      action: generate
      input: ${input}
      output: ${output as application/x-npz}

component:
  id: kimodo
  type: model
  task: motion-generation
  driver: custom
  family: kimodo
  # Kimodo model short key or full HuggingFace display name. The checkpoint
  # is pulled from `nvidia/<preset>` on first use and cached locally; set
  # `model:` explicitly to override. Available presets: Kimodo-SOMA-RP-v1.1
  # (default), Kimodo-SOMA-SEED-v1.1, Kimodo-G1-RP-v1, Kimodo-G1-SEED-v1,
  # Kimodo-SMPLX-RP-v1.
  preset: Kimodo-SOMA-RP-v1.1
  # cfg_type: separated   # nocfg | regular | separated
  # text_encoder_device: cpu   # Keeps VRAM under ~3 GiB; slightly slower text encoding.
  # text_encoder_fp32: false
  max_concurrent_count: 1
  actions:
    - id: generate
      method: generate
      prompt: ${input.prompt as text}
      seed: ${input.seed as integer}
      params:
        duration: ${input.duration as number | 4.0}
        num_samples: ${input.num_samples as integer | 1}
        diffusion_steps: ${input.diffusion_steps as integer | 10}
        # Single value for `regular` CFG, or a [text, constraint] pair for
        # `separated` CFG (matches the Kimodo CLI --cfg_weight behavior).
        cfg_weight: ${input.cfg_weight as number | 2.0}
        post_processing: ${input.post_processing as boolean | true}
