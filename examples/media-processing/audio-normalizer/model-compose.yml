controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Audio Normalizer
  description: |
    Normalize an input audio to a target integrated loudness (LUFS,
    ITU-R BS.1770) with true-peak protection. Suits streaming or
    broadcast delivery where perceived loudness must match a target
    (e.g. -14 LUFS for YouTube/Spotify).
  job:
    component: normalizer
    input:
      audio: ${input.audio as audio}
      level: ${input.level | -14}
      true_peak_ceiling: ${input.true_peak_ceiling | -1}
    output:
      audio: ${output as audio}

components:
  - id: normalizer
    type: audio-processor
    action:
      method: normalize
      mode: lufs
      audio: ${input.audio}
      level: ${input.level}
      true_peak_ceiling: ${input.true_peak_ceiling}
