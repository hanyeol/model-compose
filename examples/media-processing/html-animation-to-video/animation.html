<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: #0b1220; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="viz" width="1280" height="720"></canvas>
  <script>
    // Implement the window.__renderer contract expected by model-compose's
    // html_frame_renderer component. The page exposes `duration` and `seek(t)`
    // on window.__renderer; the engine reads duration to count frames, then
    // calls seek(t) once per frame and takes a screenshot after each call.

    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");

    const totalDuration = 5.0;

    // props is optional workflow-provided data injected by the engine before
    // page load. The page reads whatever it needs; here we expect an optional
    // { title } field.
    const title = window.__renderer?.props?.title ?? "Hello, model-compose";

    function drawFrame(t) {
      const w = canvas.width;
      const h = canvas.height;
      const progress = t / totalDuration;

      // background
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, w, h);

      // title in the center, gently pulsing and hue-shifting
      const pulse = 1 + Math.sin(progress * Math.PI * 2) * 0.05;
      const hue = (progress * 360) % 360;
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = `hsl(${hue}, 80%, 65%)`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 96px sans-serif";
      ctx.fillText(title, 0, 0);
      ctx.restore();

      // progress bar at the bottom
      ctx.fillStyle = "#ffffff33";
      ctx.fillRect(40, h - 40, w - 80, 8);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(40, h - 40, (w - 80) * progress, 8);
    }

    window.__renderer = window.__renderer || {};
    Object.assign(window.__renderer, {
      duration: totalDuration,
      seek(t) {
        drawFrame(t);
      },
    });
  </script>
</body>
</html>
