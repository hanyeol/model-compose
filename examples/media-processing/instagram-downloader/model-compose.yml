controller:
  adapter:
    type: http-server
    base_path: /api
    port: 8080
  webui:
    driver: gradio
    port: 8081

# Attach to a Chrome instance the user launched locally with
# `--remote-debugging-port=9222`. That way login, CAPTCHA, and any 2FA
# happen in a real browser window the user can see and interact with —
# no Docker, no VNC. macOS example:
#
#   /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome \
#     --remote-debugging-port=9222 \
#     --user-data-dir=/tmp/chrome-instagram-profile
#
# Log into Instagram once in that window before running the workflow.
# Unlike YouTube and TikTok, Instagram almost always requires an
# authenticated session: reels, stories, and even many public posts
# return "login to continue" without cookies.

workflows:
  - id: download-instagram-media
    title: Download Instagram media
    description: >
      Sign into Instagram in the attached Chrome, hand the resulting
      session cookies to yt-dlp, and download the requested post, reel,
      or IGTV clip. Use this for anything on instagram.com — stories,
      reels, feed videos, and private-account posts all need a
      signed-in cookie set to extract.
    jobs:
      # Land on Instagram so the session cookies are set on the right
      # domain. If the user is already signed in from a prior run the
      # interrupt below is a quick click-through.
      - id: open-instagram
        component: browser
        action: navigate
        input:
          url: https://www.instagram.com/

      # Ask the page whether the user is already signed in. The nav
      # bar's profile link (`a[href^='/']` with the current user's
      # avatar image) only renders for authenticated sessions, so its
      # presence is the cheapest boolean signal available without
      # waiting. We key off the "New post" button, which is more
      # stable than avatar-based selectors across Instagram UI
      # revisions.
      - id: check-signin
        component: browser
        action: check-signin
        depends_on: [ open-instagram ]

      # Only interrupt when the previous job reported the user is not
      # signed in. If check-signin returned true (reused session from
      # a prior run), skip the pause entirely and proceed straight to
      # collecting cookies. Instagram's login flow (password entry,
      # 2FA, "suspicious login" email confirmation, CAPTCHA) is
      # hostile to automation, so we don't try to script it — we just
      # wait for the signed-in nav to render, which only happens once
      # the account is active.
      - id: wait-for-signin
        component: browser
        action: wait-for-nav
        interrupt:
          before:
            condition:
              input: ${jobs.check-signin.output}
              value: false
            message: >
              Sign into Instagram in the Chrome window attached at
              localhost:9222, then click Resume. The workflow will
              wait for the signed-in nav to render before continuing.
        depends_on: [ check-signin ]

      # Grab every cookie scoped to instagram.com. yt-dlp's Instagram
      # extractor needs `sessionid`, `ds_user_id`, and `csrftoken` at
      # minimum — collecting the whole set keeps us resilient to
      # Instagram adding new auth cookies.
      - id: collect-cookies
        component: browser
        action: get-instagram-cookies
        depends_on: [ wait-for-signin ]

      - id: download
        component: downloader
        action: download
        input:
          url: ${input.url @(description Instagram post, reel, or IGTV URL)}
          format: ${input.format | mp4 @(description mp4 | webm | mkv)}
          cookies: ${jobs.collect-cookies.output}
        output:
          # `as video` picks the video stream wrapper so the WebUI renders
          # an inline player and the HTTP response advertises the right
          # content type. For single-image posts, Instagram's extractor
          # returns the image as the download; switch this to `as file`
          # if you plan to feed stills through the workflow.
          video: ${output as video}
        depends_on: [ collect-cookies ]

components:
  - id: browser
    type: web-browser
    driver: chrome
    debugger:
      host: localhost
      port: 9222
    timeout: 60s
    actions:
      - id: navigate
        method: navigate
        url: ${input.url}
        wait_until: domcontentloaded

      # Return true/false for "is the signed-in nav present".
      # Instagram renders its nav bar with client-side JS after
      # DOMContentLoaded, so a single querySelector at load time
      # reports false even for already-signed-in sessions. Poll for
      # up to 5 seconds so a warm session is detected without
      # triggering the interrupt. The "New post" button
      # (`svg[aria-label='New post']`) only renders when authenticated.
      - id: check-signin
        method: evaluate
        expression: >
          (async () => {
            const selector = "svg[aria-label='New post'], a[href='/direct/inbox/']";
            for (let i = 0; i < 10; i++) {
              if (document.querySelector(selector)) return true;
              await new Promise(r => setTimeout(r, 500));
            }
            return false;
          })()

      # Poll for the signed-in nav. The "New post" button and the
      # direct-inbox link are both nav-level elements that only render
      # once the account is active — more stable than the avatar
      # image, whose selector shuffles with every UI revision.
      - id: wait-for-nav
        method: wait-for
        selector: "svg[aria-label='New post'], a[href='/direct/inbox/']"
        condition: visible
        timeout: 300s

      - id: get-instagram-cookies
        method: get-cookies
        urls:
          - https://www.instagram.com/

  - id: downloader
    type: media-downloader
    driver: ytdlp
    actions:
      - id: download
        url: ${input.url}
        format: ${input.format}
        # CDP/Playwright-shaped cookie list. yt-dlp writes these into a
        # Netscape cookie file internally, preserving domain, path,
        # secure, and expiry from each cookie object.
        cookies: ${input.cookies}
