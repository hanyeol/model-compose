controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflows:
  # -------------- Main workflow: overlay pose skeletons on a video --------------
  - id: pose-skeleton-overlay
    default: true
    title: Pose Skeleton Overlay
    description: |
      Detect and track every person in a video with YOLOv8-pose, render a
      skeleton for each pose on top of its source frame, and reassemble the
      overlaid frames back into an mp4 with the original audio track
      preserved.

      The pipeline runs end-to-end in streaming mode so memory stays bounded
      regardless of clip length: frames flow one-by-one from the extractor
      through pose-tracking, and each per-frame chunk (carrying the source
      image plus one full-frame skeleton image per detected pose) is merged
      into a single composited frame and handed directly to ffmpeg's encoder
      without materialising the full frame set.
    jobs:
      # 1. Fan the raw upload stream out to two independent consumers.
      #    The upload is a single-use stream, so it can only be drained
      #    by one downstream job — fan-out tees it into two branches
      #    that the audio extractor and the frame extractor consume in
      #    parallel, without landing the video on disk.
      - id: fanout-video
        type: fan-out
        input: ${input.video as video}
        output: [ for-audio, for-frames ]

      # 2. Split the audio track out of the video (preserved unchanged).
      - id: extract-audio
        component: audio-extractor
        input:
          source: ${jobs.fanout-video.output.for-audio}
        depends_on: [ fanout-video ]

      # 3. Stream frames out of the video. `streaming: true` emits frames
      #    as ffmpeg decodes them, without buffering the whole video.
      - id: extract-frames
        component: frame-extractor
        input:
          video: ${jobs.fanout-video.output.for-frames}
          frame_interval: 1
        depends_on: [ fanout-video ]

      # 4. Pose-tracking runs on the frame stream and re-emits a chunk stream.
      #    Each extractor chunk is `{image, timestamp}`; the `|` split under
      #    `stream:` reuses that single stream to feed `frames` and `timestamps`
      #    in lockstep without fanning the stream out. Keep the split nested —
      #    sibling keys next to `"|"` are treated as additional lanes and get
      #    replicated per source chunk, so scalars like `min_confidence` would
      #    silently fan out across every frame. With `timestamps` set the
      #    tracker uses the real pts for every per-frame decision, so no
      #    `frame_rate` is needed here and the pipeline stays correct on VFR
      #    input.
      #
      #    We disable tracks/metadata and enable detection chunks (with the
      #    source image + per-pose skeleton renders) so the downstream stream
      #    contains only `{type: "detection", number, timestamp, poses:
      #    [{track_id, bounding_box, skeleton_image}], image}` — exactly the
      #    shape the merge step needs.
      - id: track-poses
        component: pose-tracker
        input:
          stream:
            "|": ${jobs.extract-frames.output}
            frames: ${item.image}
            timestamps: ${item.timestamp}
          min_confidence: ${input.min_confidence as number | 0.4}
          skeleton_format: ${input.skeleton_format as select/natural,openpose | natural}
        depends_on: [ extract-frames ]

      # 5. For each per-frame chunk, composite every pose's skeleton image
      #    (already rendered at the full frame size) on top of the source
      #    frame in one pass. The `do:` output keeps the merged image paired
      #    with the chunk's `timestamp` so the encoder can CFR-snap the
      #    overlaid frames to the real pts of the source — important when
      #    the extractor is sub-sampling (`frame_interval > 1`) or when the
      #    source is VFR. Because the input is a stream the for-each output
      #    is also a stream — overlaid frames flow lazily into the encoder
      #    below.
      - id: overlay-skeletons
        type: for-each
        input: ${jobs.track-poses.output}
        batch_size: 8
        depends_on: [ track-poses ]
        do:
          component: skeleton-merger
          input:
            # Prepend the source frame as the base layer, then spread every
            # detected pose's full-frame skeleton PNG on top with `...` so
            # `[frame, skel1, skel2, ...]` reaches `merge` as a single flat
            # image list — the shape `merge` expects.
            images:
              - ${item.image}
              - ...${item.poses[*].skeleton_image}
          output:
            image: ${output}
            timestamp: ${item.timestamp}

      # 6. Reassemble the overlaid frame stream + the original audio into mp4.
      #    The `|` split under `stream:` reuses the overlay stream to feed
      #    `frames` and `timestamps` in lockstep: the encoder snaps each
      #    merged frame to the real pts of its source chunk, so the output
      #    timeline tracks the extractor's pts even on VFR input or sub-
      #    sampled strides. Keep the split nested — a sibling `audio:` or
      #    `frame_rate:` next to `"|"` would be read as another lane and
      #    replicated per frame. `frame_rate` stays — it is the output CFR
      #    grid, not a per-frame timing cue.
      - id: encode-video
        component: encoder
        input:
          stream:
            "|": ${jobs.overlay-skeletons.output}
            frames: ${item.image}
            timestamps: ${item.timestamp}
          frame_rate: ${input.frame_rate as number | 30}
          audio: ${jobs.extract-audio.output}
        depends_on: [ extract-audio, overlay-skeletons ]

    output:
      video: ${jobs.encode-video.output as video}

components:
  # ---- Split audio track out (mp3 by default) ----
  - id: audio-extractor
    type: audio-extractor
    driver: ffmpeg
    action:
      source: ${input.source}
      format: mp3

  # ---- Stream every frame at native fps ----
  # The extractor emits `{image, timestamp}` chunks; we keep that shape so
  # the downstream pose-tracker can split one lane for `frames` and one for
  # `timestamps` with the `|` operator — tracking stays in lockstep with the
  # real pts without fanning the stream out.
  - id: frame-extractor
    type: video-frame-extractor
    driver: ffmpeg
    action:
      video: ${input.video}
      frame_interval: ${input.frame_interval}
      streaming: true

  # ---- Pose tracker (YOLOv8-pose) ----
  # The YOLOv8n-pose weights are downloaded automatically on first run from
  # the ultralytics assets release. Swap for yolov8s/m/l/x-pose.pt for
  # higher accuracy at higher cost.
  #
  # We use the tracker (not a bare detector) so identity stays stable
  # across frames and each per-frame chunk arrives packaged with both the
  # source image (`return_frame_image: true`) and one full-frame skeleton
  # PNG per detected pose (`return_skeleton_image: true`) — the merge step
  # only needs to composite them. Track segments and terminal metadata are
  # suppressed since the overlay pipeline ignores them.
  - id: pose-tracker
    type: model
    task: pose-tracking
    driver: custom
    family: yolo
    max_concurrent_count: 1
    model:
      provider: local
      url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n-pose.pt
    action:
      frames: ${input.stream.frames as image}
      timestamps: ${input.stream.timestamps}
      streaming: true
      return_tracks: false
      return_detections: true
      return_frame_image: true
      return_skeleton_image: true
      return_metadata: false
      skeleton_format: ${input.skeleton_format}
      params:
        min_confidence: ${input.min_confidence}

  # ---- Composite frame + N skeleton images in one pass ----
  # `merge` alpha-composites every input image onto a shared canvas sized
  # to the largest input. Since the skeleton renders are the same size as
  # the source frame, everything lines up 1:1 — no per-pose x/y math
  # needed.
  - id: skeleton-merger
    type: image-processor
    driver: native
    action:
      method: merge
      image: ${input.images as image[]}
      anchor: top-left

  # ---- Reassemble overlaid frames + original audio into an mp4 ----
  - id: encoder
    type: video-encoder
    driver: ffmpeg
    action:
      frames: ${input.stream.frames as image}
      timestamps: ${input.stream.timestamps}
      frame_rate: ${input.frame_rate}
      audio: ${input.audio}
      encoding:
        format: mp4
        video:
          codec: libx264
          bitrate: 8M
        audio:
          codec: aac
          bitrate: 192k
