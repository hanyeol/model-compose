controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflows:
  - id: main
    default: true
    title: Web Researcher Agent
    description: An autonomous agent that searches the web and fetches pages to research a topic and provide a comprehensive answer.
    job:
      component: research-agent
      input:
        question: ${input.question as text}
      output:
        answer: ${output[-1].blocks[0].text as markdown}
        messages: ${output as json}

  - id: search-web
    private: true
    name: search_web
    description: Search the web for information on a given query. Returns a list of relevant results with titles, URLs, and snippets.
    jobs:
      - component: tavily
        input:
          query: ${input.query @(description The search query string)}
          max_results: ${input.max_results as integer | 5 @(description Maximum number of search results to return)}
        output: ${output as json}

  - id: fetch-page
    private: true
    name: fetch_page
    description: Fetch and extract the text content from a web page URL.
    jobs:
      - component: scraper
        input:
          url: ${input.url @(description The URL of the web page to fetch)}
        output: ${output as text}

components:
  - id: research-agent
    type: agent
    instructions: You are a web research assistant. Search the web and fetch pages to thoroughly research the given topic, then provide a comprehensive, well-organized answer.
    model:
      component: gpt-4o
      input:
        messages: ${messages}
        tools: ${tools}
    tools:
      - search-web
      - fetch-page
    max_iteration_count: 10
    action:
      prompt: ${input.question}

  - id: gpt-4o
    type: http-client
    base_url: https://api.openai.com/v1
    action:
      path: /chat/completions
      method: POST
      headers:
        Authorization: Bearer ${env.OPENAI_API_KEY}
        Content-Type: application/json
      body:
        model: gpt-4o
        # Canonical (block form) messages → OpenAI Chat Completions wire format.
        # Default shape is {role, content} for system/user; assistant and tool
        # override selectively via "?".
        messages:
          "*": ${input.messages}
          role: ${item.role}
          content: ${item.blocks[0].text}
          "?":
            - input: ${item.role}
              value: assistant
              if_true:
                content:
                  "?":
                    input: ${item.blocks[0].type}
                    value: text
                    if_true: ${item.blocks[0].text}
                tool_calls:
                  "*":
                    input: ${item.blocks}
                    where:
                      input: ${item.type}
                      value: tool_call
                  id: ${item.id}
                  type: function
                  function:
                    name: ${item.name}
                    arguments: ${item.arguments as text}
            - input: ${item.role}
              value: tool
              if_true:
                tool_call_id: ${item.blocks[0].id}
                content: ${item.blocks[0].content}
        # Canonical tool schemas → OpenAI's function-tool wrapper.
        tools:
          "*": ${input.tools}
          type: function
          function: ${item}
      # OpenAI response → dict the agent consumes.
      output:
        content: ${response.choices[0].message.content}
        tool_calls:
          "*": ${response.choices[0].message.tool_calls}
          id: ${item.id}
          name: ${item.function.name}
          arguments: ${item.function.arguments as json}

  - id: tavily
    type: http-client
    action:
      endpoint: https://api.tavily.com/search
      method: POST
      headers:
        Content-Type: application/json
      body:
        api_key: ${env.TAVILY_API_KEY}
        query: ${input.query}
        max_results: ${input.max_results}
      output: ${response.results}

  - id: scraper
    type: web-scraper
    action:
      url: ${input.url}
      selector: body
      extract_mode: text
      output: ${result}
