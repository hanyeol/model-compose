controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Typed Decision (Kev-4B)
  description: One-shot typed decisions from a state and a per-question schema (noul/choice/score); returns the chosen value plus per-candidate probabilities per question, without generating any free-form text.
  job:
    input: ${input}
    output: ${result as json}

component:
  type: model
  task: typed-decision
  driver: custom
  family: kev
  model: jaredpalmer/kev-4b                    # kev checkpoint (bundles LoRA adapter + pointer head; base model id is read from head.pt)
  backend: auto                                # 'auto' | 'torch' | 'mlx'; auto picks MLX on Apple Silicon hybrid bases
  max_state: 8192                              # tokens allotted to the shared state (context) portion
  max_branch: 8192                             # tokens allotted to per-question branches
  max_concurrent_count: 1
  runtime:
    type: virtualenv
    driver: pyenv                              # kev requires Python >=3.12,<3.14; use pyenv to provision a matching interpreter
    python: "3.12.6"                           # pyenv-managed interpreter version for the venv
    path: .venv/kev                            # relative to cwd; created on first run
  action:
    text: ${input.text as text}                # the state (unstructured text) the model judges
    schema: ${input.schema as json}            # per-question map keyed by qid; each { type: noul|choice|score, instructions?, criteria? }
    return_probabilities: true                 # include per-candidate scores per question
    return_logits: false                       # kev does not surface raw logits at the API level
