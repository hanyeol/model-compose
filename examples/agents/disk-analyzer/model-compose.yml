controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflows:
  - id: main
    default: true
    title: Disk Analyzer Agent
    description: An autonomous agent that uses shell commands to analyze system disk usage and provide detailed recommendations.
    job:
      component: disk-analyzer
      input:
        question: ${input.question as text | Analyze the disk usage of this system and identify any issues.}
      output: ${output[-1].content[0].text as markdown}

  - id: get-disk-usage
    private: true
    name: get_disk_usage
    description: Get overall disk usage information for all mounted filesystems using df -h.
    jobs:
      - component: disk-usage
        output: ${output as text}

  - id: get-directory-sizes
    private: true
    name: get_directory_sizes
    description: Get the total size of a specific directory using du -sh.
    jobs:
      - component: directory-sizes
        input:
          path: ${input.path @(description Absolute path of the directory to measure)}
        output: ${output as text}

  - id: list-files
    private: true
    name: list_files
    description: List files and directories with details (permissions, size, date) in a given path using ls -la.
    jobs:
      - component: file-lister
        input:
          path: ${input.path @(description Absolute path of the directory to list)}
        output: ${output as text}

components:
  - id: disk-analyzer
    type: agent
    instructions: You are a system administrator assistant. Analyze disk usage using the available tools and provide detailed recommendations for managing disk space.
    model:
      component: gpt-4o
      input:
        messages: ${messages}
        tools: ${tools}
    tools:
      - get-disk-usage
      - get-directory-sizes
      - list-files
    max_iteration_count: 10
    action:
      prompt: ${input.question}

  - id: gpt-4o
    type: http-client
    base_url: https://api.openai.com/v1
    action:
      path: /chat/completions
      method: POST
      headers:
        Authorization: Bearer ${env.OPENAI_API_KEY}
        Content-Type: application/json
      body:
        model: gpt-4o
        # Canonical (block form) messages → OpenAI Chat Completions wire format.
        # Default shape is {role, content} for system/user; assistant and tool
        # override selectively via "?".
        messages:
          "*": ${input.messages}
          role: ${item.role}
          content: ${item.content[0].text}
          "?":
            - input: ${item.role}
              value: assistant
              if_true:
                content:
                  "?":
                    input: ${item.content[0].type}
                    value: text
                    if_true: ${item.content[0].text}
                tool_calls:
                  "*":
                    input: ${item.content}
                    where:
                      input: ${item.type}
                      value: tool_call
                  id: ${item.id}
                  type: function
                  function:
                    name: ${item.name}
                    arguments: ${item.arguments as text}
            - input: ${item.role}
              value: tool
              if_true:
                tool_call_id: ${item.content[0].id}
                content: ${item.content[0].content}
        # Canonical tool schemas → OpenAI's function-tool wrapper.
        tools:
          "*": ${input.tools}
          type: function
          function: ${item}
      # OpenAI response → dict the agent consumes.
      # OpenAI response → canonical assistant message the agent consumes.
      output:
        role: assistant
        content:
          "+":
            - "?":
                input: ${response.choices[0].message.content}
                operator: neq
                value: null
                if_true:
                  - type: text
                    text: ${response.choices[0].message.content}
            - "*": ${response.choices[0].message.tool_calls}
              type: tool_call
              id: ${item.id}
              name: ${item.function.name}
              arguments: ${item.function.arguments as json}

  - id: disk-usage
    type: shell
    action:
      command: [ df, -h ]
      output: ${result.stdout}

  - id: directory-sizes
    type: shell
    action:
      command: [ du, -sh, "${input.path}" ]
      timeout: 30.0
      output: ${result.stdout}

  - id: file-lister
    type: shell
    action:
      command: [ ls, -la, "${input.path}" ]
      output: ${result.stdout}
