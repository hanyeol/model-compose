controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Vast.ai Runtime (Whisper transcription)
  description: |
    Runs a Whisper speech-to-text model on a remote Vast.ai GPU instance.
    The instance is created on the first request and stopped after
    `idle_timeout`; subsequent requests resume the same instance in
    seconds.

    Use this example to validate the Vast.ai runtime end-to-end before
    moving to heavier models — Whisper is ~1.6 GB and runs comfortably
    on a single RTX 4090.
  job:
    input: ${input}
    output:
      transcription: ${output as json}

component:
  id: whisper
  type: model
  task: speech-to-text
  driver: huggingface
  architecture: whisper
  model: openai/whisper-large-v3-turbo
  device: cuda
  max_concurrent_count: 1
  runtime:
    type: vastai
    # Required: your Vast.ai API key. Set VASTAI_API_KEY in your .env or shell.
    api_key: ${env.VASTAI_API_KEY}

    # Required: exact GPU catalog name. See
    # https://cloud.vast.ai/create/ for the full list; names are
    # whitespace-separated (e.g. "RTX 4090", "H100 SXM").
    gpu_type: ${env.VASTAI_GPU_TYPE | RTX 4090}
    gpu_count: ${env.VASTAI_GPU_COUNT as integer | 1}

    # VERIFIED selects any Vast-vetted host (datacenter or non-DC); it is
    # the cheapest tier whose billing/network behavior matches what
    # model-compose assumes. Change to DATACENTER for strictly commercial
    # datacenter hosts, UNVERIFIED for peer-hosted inventory only, or ALL
    # to skip the filter and lean on host reliability score.
    cloud_type: ${env.VASTAI_CLOUD_TYPE | VERIFIED}

    # Pre-create a network volume in the Vast.ai dashboard and paste its ID.
    # A 20 GB volume is plenty for whisper-large-v3-turbo (~1.6 GB weights
    # + pip cache). Model weights persist across stop/resume.
    network_volume_id: ${env.VASTAI_VOLUME_ID}

    # Stop the instance 5 minutes after the last request. Billing resumes
    # when the next request arrives (resume takes seconds, not minutes).
    idle_timeout: 5m
  action:
    audio: ${input.audio as audio}
    language: ${input.language}
    task: ${input.task as select/transcribe,translate | transcribe}
    return_timestamps: true
    max_output_length: 444
