controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Music Embedding (Sample ID)
  description: Embed an audio recording into a fixed-size vector suitable for sample-identification retrieval.
  job:
    input: ${input}
    output:
      embedding: ${output as json}

component:
  type: model
  task: music-embedding
  driver: custom
  family: sampleid
  # Sample ID's default checkpoint is downloaded from Zenodo on first use
  # (~200 MB) and cached inside the installed `sampleid` package directory.
  # To pin a local checkpoint instead, set `model: /absolute/path/to/your.ckpt`.
  device: auto
  max_concurrent_count: 1
  runtime:
    type: virtualenv
    driver: python                           # default; uses `python -m venv`
    path: .venv/sampleid                     # relative to cwd; created on first run
    start_timeout: 600s                      # first run downloads the 7B checkpoint and installs deps
    stop_timeout: 30s
  action:
    audio: ${input.audio as audio}
    params:
      normalize: ${input.normalize as boolean | true}
