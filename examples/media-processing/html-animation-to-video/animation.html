<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: #0b1220; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="viz" width="1280" height="720"></canvas>
  <script>
    // Implement the contract expected by model-compose's html_frame_renderer
    // component. The engine sets `duration` (from the action's `duration`
    // field) on window.__renderer before any page script runs. The page
    // defines a top-level `window.render(t)` and flips window.__renderer.ready
    // to true once it's prepared to capture.
    //
    // For faster capture, the page should call window.__renderer.rendered(t) once
    // the frame is fully painted. This lets the engine pipeline render/screenshot
    // instead of waiting for render()'s RPC response. If rendered() is never called,
    // the engine falls back to the sequential path.

    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");

    const duration = window.__renderer.duration;

    // props is optional workflow-provided data injected by the engine before
    // page load. The page reads whatever it needs; here we expect an optional
    // { title } field.
    const title = window.__renderer?.props?.title ?? "Hello, model-compose";

    function drawFrame(t) {
      const w = canvas.width;
      const h = canvas.height;
      const progress = t / duration;

      // background
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, w, h);

      // title in the center, gently pulsing and hue-shifting
      const pulse = 1 + Math.sin(progress * Math.PI * 2) * 0.05;
      const hue = (progress * 360) % 360;
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = `hsl(${hue}, 80%, 65%)`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 96px sans-serif";
      ctx.fillText(title, 0, 0);
      ctx.restore();

      // progress bar at the bottom
      ctx.fillStyle = "#ffffff33";
      ctx.fillRect(40, h - 40, w - 80, 8);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(40, h - 40, (w - 80) * progress, 8);
    }

    window.render = (t) => {
      drawFrame(t);
      window.__renderer.rendered(t);
    };
    // Signal "ready for capture". The driver only starts rendering after
    // this flips. Nothing to await here (no webfonts, images, or scene
    // load), so we flip it immediately.
    window.__renderer.ready = true;
  </script>
</body>
</html>
