controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflows:
  - id: render
    title: Audio Spectrum Video
    description: |
      Extract a per-frame frequency spectrum from an audio file and render
      it as an equalizer MP4 with the original audio muxed back in. The
      uploaded audio stream is spooled through a fan-out job so the
      spectrum extractor and the video encoder can each read it
      independently — the encoder branch only opens the audio after the
      spectrum → frame render pipeline lands, which would stall a plain
      in-memory fan-out.
    jobs:
      # 1. Fan the raw audio upload out to two independent consumers with
      #    `spool: true`. The upload is single-use, and the encoder only
      #    starts consuming its branch after the spectrum extractor and
      #    the HTML frame renderer have finished — a plain in-memory
      #    fan-out queue would have to buffer the whole audio to hold the
      #    encoder's branch open. Spool lands the upload on a tempfile
      #    once and hands both branches a file-backed StreamResource.
      - id: fanout-audio
        type: fan-out
        input: ${input.audio as audio}
        output: [ for-spectrum, for-encode ]
        spool: true

      - id: spectrum
        component: extractor
        input:
          audio: ${jobs.fanout-audio.output.for-spectrum}
          fps: ${input.fps as select/24,30,60 | 30}
          band_count: ${input.band_count as integer | 48}
        output: ${output as json}
        depends_on: [ fanout-audio ]

      - id: frames
        component: renderer
        input:
          spectrum: ${jobs.spectrum.output}
          fps: ${input.fps as select/24,30,60 | 30}
        output: ${output}
        depends_on: [ spectrum ]

      - id: encode
        component: encoder
        input:
          frames: ${jobs.frames.output}
          frame_rate: ${input.fps as select/24,30,60 | 30}
          audio: ${jobs.fanout-audio.output.for-encode}
        output: ${output as video}
        depends_on: [ fanout-audio, frames ]

components:
  - id: extractor
    type: audio-feature-extractor
    action:
      feature: spectrum
      audio: ${input.audio}
      fps: ${input.fps}
      band_count: ${input.band_count}
      min_frequency: 40.0
      window_size: 2048
      window_type: hann
      frequency_scale: log
      normalize_mode: peak-percentile

  - id: renderer
    type: html-frame-renderer
    driver: playwright
    headless: true
    action:
      html: ./animation.html
      fps: ${input.fps}
      width: 1280
      height: 720
      props:
        spectrum: ${input.spectrum}
      streaming: true
      output: ${result[].image}

  - id: encoder
    type: video-encoder
    driver: ffmpeg
    action:
      frames: ${input.frames}
      frame_rate: ${input.frame_rate}
      audio: ${input.audio}
      encoding:
        format: mp4
        video:
          codec: libx264
          bitrate: 4M
