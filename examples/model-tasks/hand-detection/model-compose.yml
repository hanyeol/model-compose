controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Detect Hands from Image
  description: Detect per-hand 21-point landmarks and handedness from an input image using MediaPipe Hand Landmarker.
  job:
    input: ${input}
    output:
      handedness: ${output.hands[0].handedness}
      handedness_score: ${output.hands[0].handedness_score as number}
      bounding_box: ${output.hands[0].bounding_box as json}
      keypoints: ${output.hands[0].keypoints as json}
      keypoints_3d: ${output.hands[0].keypoints_3d as json}
      segmentation_mask: ${output.hands[0].segmentation_mask as image/png}
      skeleton_image: ${output.hands[0].skeleton_image as image/png}

component:
  type: model
  task: hand-detection
  driver: custom
  family: blazehand
  model:
    provider: local
    url: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
  max_concurrent_count: 1
  action:
    image: ${input.image as image}
    max_detection_count: ${input.max_detection_count | 2}
    skeleton_format: ${input.skeleton_format | natural}
    return_keypoints: true
    return_keypoints_3d: ${input.return_keypoints_3d as boolean | false}
    return_segmentation_mask: ${input.return_segmentation_mask as boolean | false}
    return_skeleton_image: ${input.return_skeleton_image as boolean | false}
    crop_margin_ratio: ${input.crop_margin_ratio as number | 0.0}
    params:
      min_confidence: ${input.min_confidence | 0.5}
      min_presence_confidence: ${input.min_presence_confidence | 0.5}
      min_tracking_confidence: ${input.min_tracking_confidence | 0.5}
