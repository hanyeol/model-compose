controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Audio Refiner
  description: |
    Detect speech regions in an input audio with Silero VAD, then clip out
    only those regions and concatenate them into a single refined audio.
    Non-speech regions (silence, breath, background noise) are dropped, so
    the output contains speech only.
  jobs:
    - id: detect
      component: vad
      input:
        audio: ${input.audio as audio}
        threshold: ${input.threshold | 0.5}
        min_speech_duration: ${input.min_speech_duration | 250ms}
        min_silence_duration: ${input.min_silence_duration | 500ms}
        speech_padding_time: ${input.speech_padding_time | 100ms}
      output: ${output}

    - id: refine
      component: clipper
      depends_on: [ detect ]
      input:
        audio: ${input.audio as audio}
        spans: ${jobs.detect.output}
      output:
        audio: ${output as audio}

components:
  - id: vad
    type: model
    task: voice-activity-detection
    driver: custom
    family: silero
    device: cpu
    max_concurrent_count: 1
    action:
      audio: ${input.audio}
      sample_rate: 16000
      params:
        threshold: ${input.threshold}
        min_speech_duration: ${input.min_speech_duration}
        min_silence_duration: ${input.min_silence_duration}
        speech_padding_time: ${input.speech_padding_time}

  - id: clipper
    type: audio-clipper
    action:
      audio: ${input.audio}
      # VAD emits [{start_time, end_time, confidence}, ...] — the clipper only
      # reads start_time/end_time, so the extra 'confidence' field is ignored.
      span: ${input.spans}
      # Concatenate all speech clips into a single output audio.
      merge: true
