controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflows:
  - id: main
    default: true
    title: Code Reviewer Agent
    description: An autonomous agent that reads files, lists directories, and searches code to perform code reviews and provide improvement suggestions.
    job:
      component: code-reviewer
      input:
        request: ${input.request as text}
        target_path: ${input.target_path as text | .}
      output:
        answer: ${output[-1].content[0].text as markdown}
        messages: ${output as json}

  - id: read-file
    private: true
    name: read_file
    description: Read and return the contents of a file at the given path.
    jobs:
      - component: file-reader
        input:
          path: ${input.path @(description Path of the file to read)}
        output: ${output as text}

  - id: list-directory
    private: true
    name: list_directory
    description: List all files and directories with details (permissions, size, date) at the given path.
    jobs:
      - component: dir-lister
        input:
          path: ${input.path @(description Path of the directory to list)}
        output: ${output as text}

  - id: search-code
    private: true
    name: search_code
    description: Search for a pattern in files recursively under the given path using grep. Returns matching lines with file paths and line numbers.
    jobs:
      - component: code-searcher
        input:
          pattern: ${input.pattern @(description The search pattern or regex to look for)}
          path: ${input.path | . @(description Directory path to search in)}
        output: ${output as text}

components:
  - id: code-reviewer
    type: agent
    instructions: You are a code review assistant. Explore the codebase by reading files, listing directories, and searching code, then provide a detailed review with improvement suggestions.
    model:
      component: gpt-4o
      input:
        messages: ${messages}
        tools: ${tools}
    tools:
      - read-file
      - list-directory
      - search-code
    max_iteration_count: 15
    action:
      prompt: |
        Target path: ${input.target_path}
        Request: ${input.request}

  - id: gpt-4o
    type: http-client
    base_url: https://api.openai.com/v1
    action:
      path: /chat/completions
      method: POST
      headers:
        Authorization: Bearer ${env.OPENAI_API_KEY}
        Content-Type: application/json
      body:
        model: gpt-4o
        # Canonical (block form) messages → OpenAI Chat Completions wire format.
        # Default shape is {role, content} for system/user; assistant and tool
        # override selectively via "?". The agent emits one tool_result per
        # tool message so role: tool is 1:1 with OpenAI's per-result messages.
        messages:
          "*": ${input.messages}
          role: ${item.role}
          content: ${item.content[0].text}
          "?":
            - input: ${item.role}
              value: assistant
              if_true:
                content:
                  "?":
                    input: ${item.content[0].type}
                    value: text
                    if_true: ${item.content[0].text}
                tool_calls:
                  "*":
                    input: ${item.content}
                    where:
                      input: ${item.type}
                      value: tool_call
                  id: ${item.id}
                  type: function
                  function:
                    name: ${item.name}
                    arguments: ${item.arguments as text}
            - input: ${item.role}
              value: tool
              if_true:
                tool_call_id: ${item.content[0].id}
                content: ${item.content[0].content}
        # Canonical tool schemas → OpenAI's function-tool wrapper.
        tools:
          "*": ${input.tools}
          type: function
          function: ${item}
      # OpenAI response.choices[0].message → dict the agent consumes:
      # {content?: str, tool_calls?: [{id, name, arguments: dict}, ...]}.
      # arguments arrive as a JSON string from OpenAI; `as json` parses it into a dict.
      # OpenAI response → canonical assistant message the agent consumes.
      output:
        role: assistant
        content:
          "+":
            - "?":
                input: ${response.choices[0].message.content}
                operator: neq
                value: null
                if_true:
                  - type: text
                    text: ${response.choices[0].message.content}
            - "*": ${response.choices[0].message.tool_calls}
              type: tool_call
              id: ${item.id}
              name: ${item.function.name}
              arguments: ${item.function.arguments as json}

  - id: file-reader
    type: shell
    action:
      command: [ cat, "${input.path}" ]
      timeout: 10.0
      output: ${result.stdout}

  - id: dir-lister
    type: shell
    action:
      command: [ ls, -la, "${input.path}" ]
      timeout: 10.0
      output: ${result.stdout}

  - id: code-searcher
    type: shell
    action:
      command: [ grep, -rn, "${input.pattern}", "${input.path}" ]
      timeout: 30.0
      output: ${result.stdout}
