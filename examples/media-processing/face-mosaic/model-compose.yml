controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflows:
  # ---------------- Main workflow: redact faces in a video ----------------
  - id: face-mosaic
    default: true
    title: Face Mosaic
    description: |
      Redact every face in a video by pixelating (or blurring) each detected
      face bounding box, then reassemble the redacted frames back into an mp4
      with the original audio track preserved.

      The pipeline runs end-to-end in streaming mode so memory stays bounded
      regardless of clip length: frames flow one-by-one from the extractor
      through face-tracking, and each per-frame chunk (carrying the source
      image plus its face bounding boxes) is mosaicked and handed directly
      to ffmpeg's encoder without materialising the full frame set.
    jobs:
      # 1. Stash the uploaded video on the local file-store so the audio
      #    branch and the frame extractor can independently re-read it
      #    (the raw upload stream is single-use).
      - id: store
        component: storage
        input:
          path: uploads/${context.task_id}
          source: ${input.video as video}

      # 2. Split the audio track out of the stored video (preserved unchanged).
      - id: extract-audio
        component: audio-extractor
        input:
          source: ${jobs.store.output.url as video;url}
        depends_on: [ store ]

      # 3. Stream frames out of the stored video. `streaming: true` emits
      #    frames as ffmpeg decodes them, without buffering the whole video.
      - id: extract-frames
        component: frame-extractor
        input:
          video: ${jobs.store.output.url as video;url}
          frame_interval: 1
        depends_on: [ store ]

      # 4. Face-tracking runs on the frame stream and re-emits a chunk stream.
      #    We disable tracks/metadata and enable frame chunks (with the source
      #    image) so the downstream stream contains only `{type: "frame",
      #    number, timestamp, faces: [{track_id, bounding_box}], image}` —
      #    exactly the shape the mosaic step needs.
      - id: track-faces
        component: face-tracker
        input:
          frames: ${jobs.extract-frames.output}
          frame_rate: ${input.frame_rate as number | 30}
          detection_threshold: ${input.min_confidence as number | 0.5}
          # Raise this if small / distant faces are being missed. The InsightFace
          # SCRFD detector runs on a square input at this resolution, so bigger
          # values recover smaller faces at proportional cost per frame.
          detection_size: ${input.detection_size as number | 640}
        depends_on: [ extract-frames ]

      # 5. For each per-frame chunk, mosaic the tracked face regions. Because
      #    the input is a stream the for-each output is also a stream —
      #    mosaicked frames flow lazily into the encoder below.
      - id: mosaic-faces
        type: for-each
        input: ${jobs.track-faces.output}
        batch_size: 16
        depends_on: [ track-faces ]
        do:
          component: mosaic
          input:
            image: ${item.image}
            region: ${item.faces[*].bounding_box}
            mode: ${input.mode as select/pixelate,blur | pixelate}
            block_scale: ${input.block_scale as number | 0.1}
            blur_radius: ${input.blur_radius as number | 8.0}
            corner_scale: ${input.corner_scale as number | 0.3}

      # 6. Reassemble the mosaicked frame stream + the original audio into mp4.
      #    The encoder pulls frames from the stream as ffmpeg is ready for
      #    them, so no full-video buffering happens at this stage either.
      - id: encode-video
        component: encoder
        input:
          # The for-each above emits a stream where each chunk is a single
          # PIL image. The encoder expects an image-array input (one array
          # per video), so wrap the stream with `+` — the renderer treats
          # `+` as "flatten these chunks into one continuous image array
          # stream" so ffmpeg pulls frames one by one without materialising
          # the full list.
          frames:
            "+": ${jobs.mosaic-faces.output}
          frame_rate: ${input.frame_rate as number | 30}
          audio: ${jobs.extract-audio.output}
        depends_on: [ extract-audio, mosaic-faces ]

    output:
      video: ${jobs.encode-video.output as video}

components:
  # Local file-store used as a scratch area for the uploaded video. On S3
  # or GCS you would swap the driver.
  - id: storage
    type: file-store
    driver: local
    base_path: ./storage
    action:
      method: put
      path: ${input.path}
      source: ${input.source}

  # ---- Split audio track out (mp3 by default) ----
  - id: audio-extractor
    type: audio-extractor
    driver: ffmpeg
    action:
      source: ${input.source}
      format: mp3

  # ---- Stream every frame at native fps ----
  # `output: ${result[].image}` projects the extractor's default
  # `{image, timestamp}` chunk stream down to just the PIL images —
  # face-tracking's `frames` input expects an image stream, not a dict
  # stream.
  - id: frame-extractor
    type: video-frame-extractor
    driver: ffmpeg
    action:
      video: ${input.video}
      frame_interval: ${input.frame_interval}
      streaming: true
      output: ${result[].image}

  # ---- Face tracker (InsightFace antelopev2) ----
  # antelopev2 is downloaded automatically on first run (no `path` or `url`
  # needed — the LocalModelConfig applies its default).
  #
  # We use the tracker (not a bare detector) so re-identification is
  # available if a later stage wants it, and we run it in streaming mode
  # with per-frame chunks that carry the source image and detected face
  # boxes — everything the mosaic step below needs, without the tracker's
  # segment/track/metadata chunks (which the mosaic pipeline ignores).
  - id: face-tracker
    type: model
    task: face-tracking
    driver: custom
    family: insightface
    max_concurrent_count: 1
    model:
      provider: local
    action:
      frames: ${input.frames as image}
      frame_rate: ${input.frame_rate}
      streaming: true
      return_tracks: false
      return_frames: true
      return_frame_image: true
      return_metadata: false
      params:
        detection_threshold: ${input.detection_threshold}
        # Expand the user-supplied square size (e.g. 640, 960, 1280) into the
        # (width, height) tuple that the InsightFace detector expects.
        detection_size:
          - ${input.detection_size as number | 640}
          - ${input.detection_size as number | 640}

  # ---- Mosaic each face bounding box in a single pass per frame ----
  - id: mosaic
    type: image-processor
    driver: native
    action:
      method: mosaic
      image: ${input.image as image}
      region: ${input.region}
      mode: ${input.mode}
      block_scale: ${input.block_scale}
      blur_radius: ${input.blur_radius}
      corner_scale: ${input.corner_scale}

  # ---- Reassemble mosaicked frames + original audio into an mp4 ----
  - id: encoder
    type: video-encoder
    driver: ffmpeg
    action:
      frames: ${input.frames as image}
      frame_rate: ${input.frame_rate}
      audio: ${input.audio}
      encoding:
        format: mp4
        video:
          codec: libx264
          bitrate: 8M
        audio:
          codec: aac
          bitrate: 192k
