controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title:
  description:
  job:
    input: ${input}
    output:
      embedding: ${output as json}

component:
  type: model
  task: face-embedding
  max_concurrent_count: 1
  family: insightface
  # The antelopev2 archive is fetched into `path` on first run and extracted
  # in-place; subsequent runs reuse the extracted directory.
  model:
    provider: local
    path: ./.models/antelopev2
    url: https://github.com/deepinsight/insightface/releases/download/v0.7/antelopev2.zip
    bundled: true
  action:
    image: ${input.face_image as image}
