controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Fine-tune Kev (LoRA + pointer head) on a typed-decision dataset
  description: Jointly train Kev's LoRA adapter and pointer-head on a {state, schema, answers} dataset. The output is a HF-style LoRA adapter directory plus pointer_head.pt, loadable via kev.checkpoint.
  jobs:
    - id: train
      component: trainer
      input:
        dataset:       ${input.dataset | ./train.jsonl}
        output_dir:    ${input.output_dir | ./output/kev}
        num_epochs:    ${input.num_epochs as integer | 3}
        batch_size:    ${input.batch_size as integer | 1}
        learning_rate: ${input.learning_rate as number | 2e-5}
      output:
        output_dir: ${output.output_dir}
        train_loss: ${output.train_loss}
        metrics:    ${output.metrics}

components:
  - id: trainer
    type: model-trainer
    task: typed-decision
    driver: kev
    model: jaredpalmer/kev-4b
    device: auto
    lora:
      rank: 8
      alpha: 16
      dropout: 0.05
    action:
      dataset: ${input.dataset}
      output_dir: ${input.output_dir | ./output/kev}
      num_epochs: ${input.num_epochs as integer | 3}
      per_device_train_batch_size: ${input.batch_size as integer | 1}
      gradient_accumulation_steps: 8
      learning_rate: ${input.learning_rate as number | 2e-5}
      bf16: true
