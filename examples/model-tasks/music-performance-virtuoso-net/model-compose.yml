controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Expressive Piano Performance (VirtuosoNet)
  description: Render a MusicXML piano score into an expressive MIDI performance using VirtuosoNet.
  job:
    input: ${input}
    output: ${output as file}

component:
  type: model
  task: music-performance
  driver: custom
  family: virtuoso-net
  model:
    repository: dasaem/virtuosonet
    allow_patterns:
      - checkpoint_best.pt
      - han_measnote_gru.yml
  device: auto
  max_concurrent_count: 1
  action:
    score: ${input.score as file}
    composer: ${input.composer as select/Bach,Balakirev,Beethoven,Brahms,Chopin,Debussy,Glinka,Haydn,Liszt,Mozart,Prokofiev,Rachmaninoff,Ravel,Schubert,Schumann,Scriabin | Chopin}
    params:
      bool_pedal: ${input.bool_pedal as boolean | false}
      disklavier: ${input.disklavier as boolean | false}
