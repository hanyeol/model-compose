controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Fine-tune a Nimble LoRA adapter on a typed-decision dataset
  description: LoRA fine-tune Qwen3.5-9B through Nimble's candidate-token cross-entropy on a {state, schema, answers} dataset. The output is a HF-style LoRA adapter directory + schema_config.json compatible with Nimble's inference-side scorer.
  jobs:
    - id: train
      component: trainer
      input:
        dataset:       ${input.dataset | ./train.jsonl}
        output_dir:    ${input.output_dir | ./output/nimble}
        num_epochs:    ${input.num_epochs as integer | 3}
        batch_size:    ${input.batch_size as integer | 2}
        learning_rate: ${input.learning_rate as number | 1e-4}
      output:
        output_dir: ${output.output_dir}
        train_loss: ${output.train_loss}
        metrics:    ${output.metrics}

components:
  - id: trainer
    type: model-trainer
    task: typed-decision
    driver: nimble
    # The LoRA adapter itself has no base weights — supply `base_model` so the
    # trainer loads the Qwen backbone the adapter attaches to.
    base_model: Qwen/Qwen3.5-9B
    # `model` here points at the output LoRA adapter identity (the inference
    # driver reuses the same convention; any valid local path is fine).
    model: ./output/nimble
    device: auto
    lora:
      rank: 8
      alpha: 16
      dropout: 0.05
    action:
      dataset: ${input.dataset}
      output_dir: ${input.output_dir | ./output/nimble}
      num_epochs: ${input.num_epochs as integer | 3}
      per_device_train_batch_size: ${input.batch_size as integer | 2}
      gradient_accumulation_steps: 8
      learning_rate: ${input.learning_rate as number | 1e-4}
      bf16: true
