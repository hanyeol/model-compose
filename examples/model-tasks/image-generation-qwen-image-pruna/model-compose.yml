controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Qwen-Image 2.1 + Pruna Distilled LoRA
  description: Generate images with Qwen-Image-2.1 accelerated by PrunaAI's distilled LoRA — 5- or 8-step sampling instead of the base 40 steps.
  job:
    input: ${input}
    output: ${output as image/png}

component:
  type: model
  task: image-generation
  driver: huggingface
  architecture: qwen-image
  device: cuda
  # Base model is `Qwen/Qwen-Image-2.1` (gated). Accept the license on
  # HuggingFace and export `HF_TOKEN` before running.
  model:
    provider: huggingface
    repository: Qwen/Qwen-Image-2.1
    token: ${env.HF_TOKEN}
  # PrunaAI's distilled LoRA shipped in two variants (5-step and 8-step). The
  # 8-step variant is the safer default; switch `filename` to
  # `p_qwen_image_2.1_5step_v0.1.safetensors` for maximum speed.
  peft_adapters:
    - type: lora
      name: pruna
      model:
        provider: huggingface
        repository: PrunaAI/Pruna-Qwen-Image-2.1
        filename: p_qwen_image_2.1_8step_v0.1.safetensors
      weight: 1.0
  cpu_offload: model
  max_concurrent_count: 1
  # QwenImage21Pipeline is only on `diffusers` main as of 2026-09; isolate the
  # worker so the git build doesn't shadow the controller's `diffusers` install.
  runtime:
    type: virtualenv
    driver: python
    path: .venv/qwen-image-pruna
  action:
    prompt: ${input.prompt as text}
    negative_prompt: ${input.negative_prompt as text}
    image: ${input.image as image}
    width: ${input.width as integer | 1024}
    height: ${input.height as integer | 1024}
    seed: ${input.seed as integer}
    params:
      # Match the LoRA variant: 8 for `..._8step_...`, 5 for `..._5step_...`.
      # The Pruna model card notes v0.1 quality still trails the base model —
      # raise inference_steps only if you also switch to the base pipeline.
      inference_steps: ${input.inference_steps as integer | 8}
      # Custom sigma schedule required by the distilled LoRA. Length must
      # match `inference_steps`. Defaults to the 8-step schedule; switch to
      # `[1.0, 0.94, 0.857142857, 0.666666667, 0.4]` (and `inference_steps: 5`)
      # when using the 5-step file.
      sigmas: ${input.sigmas as list | [ 1.0, 0.933333333, 0.857142857, 0.769230769, 0.666666667, 0.545454545, 0.4, 0.222222222 ]}
      # Pruna's distillation targets `true_cfg_scale=1.0`; leave it there. A
      # negative_prompt is still accepted but has no effect at this scale.
      true_cfg_scale: 1.0
