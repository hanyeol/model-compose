controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflow:
  title: Qwen-Image-Edit-2509 Instruction-Based Image Editing
  description: Edit one or more reference images with a text instruction using Alibaba's Qwen-Image-Edit-2509.
  job:
    input: ${input}
    output: ${output as image/png}

component:
  type: model
  task: image-generation
  driver: huggingface
  architecture: qwen-image-edit
  device: cuda
  # `Qwen/Qwen-Image-Edit-2509` is the September iteration of Qwen-Image-Edit,
  # built on the 20B Qwen-Image base with a Qwen2.5-VL text encoder. It is
  # released under the Qwen Research License (non-commercial); accept the
  # terms on HuggingFace and export `HF_TOKEN` before running.
  model:
    provider: huggingface
    repository: Qwen/Qwen-Image-Edit-2509
    token: ${env.HF_TOKEN}
  # The 20B transformer plus the ~7B Qwen2.5-VL text encoder exceeds a single
  # 24 GB GPU when both are resident; `cpu_offload: model` moves whole modules
  # to CPU between calls and fits the pipeline into 24 GB. Drop this for 48 GB+
  # cards, or switch to `cpu_offload: sequential` for layer-level offload.
  cpu_offload: model
  max_concurrent_count: 1
  # QwenImageEditPlusPipeline is available on `diffusers >= 0.41.0`; the shared
  # controller environment may still be on an older release, so isolate the
  # worker to pin the compatible build.
  runtime:
    type: virtualenv
    driver: python
    path: .venv/qwen-image-edit
  action:
    prompt: ${input.prompt as text}
    negative_prompt: ${input.negative_prompt as text}
    # Edit-2509 accepts 1-3 reference images; pass a single image or a list.
    image: ${input.image as image}
    width: ${input.width as integer | 1024}
    height: ${input.height as integer | 1024}
    seed: ${input.seed as integer}
    params:
      inference_steps: ${input.inference_steps as integer | 40}
      # Edit-2509 ships with `true_cfg_scale = 4.0`; keep it above 1.0 so
      # `negative_prompt` actually guides sampling.
      true_cfg_scale: ${input.true_cfg_scale as number | 4.0}
      max_sequence_length: ${input.max_sequence_length as integer | 512}
