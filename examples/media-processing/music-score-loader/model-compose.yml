controller:
  adapter:
    type: http-server
    port: 8080
    base_path: /api
  webui:
    driver: gradio
    port: 8081

workflows:
  - id: load-score
    default: true
    title: Load a Score File
    description: Parse a MIDI (`.mid`/`.midi`) or MusicXML (`.xml`/`.musicxml`/`.mxl`) file into a `MusicScore` — parts with notes/lyrics/clefs plus score-level tempos, time/key signatures, and harmonies.
    job:
      component: score-loader
      action: load
      output: ${output as json}

  - id: load-score-track
    title: Load a Specific Part
    description: Pick one part by index. MIDI files split note activity per `(track, channel)`, so each combination is a separate part — pass the index of the one you want, or omit to return every part.
    job:
      component: score-loader
      action: load-track
      output: ${output as json}

  - id: load-score-as-midi
    title: Force MIDI Format
    description: Override auto-detection and parse the input as MIDI. Useful for files without a conventional extension or when the header has been stripped by an upload pipeline.
    job:
      component: score-loader
      action: load-as-midi
      output: ${output as json}

  - id: load-score-as-musicxml
    title: Force MusicXML Format
    description: Override auto-detection and parse the input as MusicXML. Accepts uncompressed `.xml`/`.musicxml` and compressed `.mxl` ZIP containers.
    job:
      component: score-loader
      action: load-as-musicxml
      output: ${output as json}

components:
  - id: score-loader
    type: music-score-loader
    driver: local
    actions:
      # format and part are both omitted → auto-detect by header/extension,
      # emit every part in the score.
      - id: load
        source: ${input.score as file}

      - id: load-track
        source: ${input.score as file}
        part: ${input.part as number | 0}

      - id: load-as-midi
        source: ${input.score as file}
        format: midi

      - id: load-as-musicxml
        source: ${input.score as file}
        format: musicxml
